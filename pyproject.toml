[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rneml"
version = "0.1.0"
description = "Blind (material-agnostic) particle-count estimation from collision sounds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "huggingface_hub>=0.24",
    "scikit-learn>=1.3",       # baselines, component analysis, probes
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rneml = "rneml.cli:main"

[tool.setuptools.packages.find]
include = ["rneml*"]
