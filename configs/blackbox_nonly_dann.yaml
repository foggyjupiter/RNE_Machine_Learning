# Same as blackbox_nonly.yaml + unsupervised sim-to-real adaptation (DANN) on real clips 1-5 per N (no labels).
# Data: dynamics of v3 + lowe (no DEM rerun) re-rendered with the simulator's black-box
# acoustics (2-2-rne-simulation src/gransim/acoustics/blackbox.py): every acoustic setting
# from physics and the apparatus (acrylic plate modes, room reverberation from Sabine +
# air absorption, random phone response), none fitted to the first-study recordings, no
# recorded clicks, no per-impact amplitude spread; noise from empty-box clips 1-5 only.
# Label: N only (no material-property heads). Level: absolute loudness removed
# (level_free), no random level augmentation. Shaker amplitude never varied.
# Real evaluation: first-study clips 6-15 of every N (1-5 never scored).
name: BX2_blackbox_nonly_dann
data_dir: /home/user/data/bbx_merged
cache_dir: /home/user/data/cache
real_dir: /home/user/foggyjupiter/2-1-cnn-/data-all
real_exclude_per_N: 5
real_unlabeled_per_N: 5          # clips 1-5 of every N, WITHOUT labels (domain-adversarial)
dann_weight: 0.3
feature: mel
use_modulation: true
n_only: true
prop_weight: 0.0
level_free: true
gain_db: 0.0
nll_weight: 0.2
pair_weight: 1.0
rank_weight: 0.5
epochs: 30
batch: 32
lr: 1.0e-3
arch: cnn
width: 16
time_pool: 2
patience: 8
threads: 4
workers: 4
