# "Known material" baseline in the style of the first study: trained only on clips
# whose material resembles the first-study BB (≤ 0.16 g, e ≈ 0.8). Evaluating it on
# the full test set and on test_ood shows what breaks when the material changes.
name: bb_baseline_v1
data_dir: data/v1
real_dir: null
train_subset: bb_like
epochs: 60
batch: 32
lr: 1.0e-3
aux_weight: 0.0
pair_weight: 0.0
rank_weight: 0.0
gain_db: 0.0
