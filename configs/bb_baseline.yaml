# "Known material" baseline in the style of the first study: trained only on clips
# whose material resembles the first-study BB (6 mm ± 0.6, light, e ≈ 0.8). Evaluating
# it on the full test set and on test_ood shows what breaks when the material changes.
name: bb_baseline
data_dir: data/v1
real_dir: null
feature: mel
train_subset: bb_like
epochs: 60
batch: 32
lr: 1.0e-3
prop_weight: 0.0
nll_weight: 0.2
pair_weight: 0.0
rank_weight: 0.0
gain_db: 0.0
